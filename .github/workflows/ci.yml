name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # Pinned tool version, run through uv: the machine doctrine bans `pip
      # install` and manual virtualenvs. `charset-normalizer` gives the linter
      # the encoding detection it needs on non-UTF-8 inputs.
      - name: Lint per-path licence declarations
        run: uvx --from 'reuse[charset-normalizer]==6.2.0' reuse lint

  rust-contracts:
    name: Rust contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.85.1
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Audit Rust advisories, licenses and sources
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check
      - name: Verify renderer-independent contracts
        run: ./scripts/check-rust.sh

  dry-run-portability:
    name: Portable dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Reject contributor-specific paths and compile scripts
        run: python3 scripts/check-dry-run-portability.py
      - name: Parse workflow module
        run: node --check dry-run/scripts/workflow-dry-run.js
      - name: Reproduce M1 sensitivity evidence twice
        run: python3 scripts/verify-m1-sensitivity.py
      # Deliberately hosted by an already-required job rather than a new
      # workflow: a check nobody is required to pass is decoration. This job is
      # the repository-hygiene job that already runs stdlib Python over tracked
      # files, so the join costs nothing here.
      - name: Reject undeclared identical file contents
        run: python3 scripts/check-duplicate-fingerprints.py

  brand-assets:
    name: Deterministic brand assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # The renderer and the PNG encoder are inputs to the byte comparison
      # below, not incidental tooling, so their versions are pinned. Unpinned,
      # they drift: run 30193088312 caught the ImageMagick in this image writing
      # a cHRM chunk that the committed files did not carry, which changed every
      # PNG hash while leaving every pixel untouched.
      #
      # A pinned version that Ubuntu later withdraws makes this step fail
      # outright. That is the intended trade: a loud "the toolchain moved" beats
      # a silent re-render.
      - name: Install the pinned rendering toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            librsvg2-bin=2.58.0+dfsg-1build1 \
            libxml2-utils=2.9.14+dfsg-1.3ubuntu3.8 \
            imagemagick=8:6.9.12.98+dfsg1-5.2build2
      # Not a gate — a log. What these packages pull in transitively, and the
      # fonts, come from the runner image and cannot be pinned from here. When
      # the byte comparison below fails, this is the record that says what moved.
      - name: Record the unpinnable part of the toolchain
        run: |
          set -euo pipefail
          rsvg-convert --version
          convert --version | head -1
          dpkg-query -W -f='${binary:Package}=${Version}\n' \
            'libmagick*' 'librsvg*' 'libcairo*' 'libfreetype*' \
            'libfontconfig*' 'libpango*' 'libpng*' 'fonts-*' 2>/dev/null | sort
          fc-list : family | tr ',' '\n' | sort -u
      - name: Generate and verify assets twice
        run: |
          set -euo pipefail
          # Run BEFORE generating: the generation below overwrites the committed
          # manifest, and the licence divergence this catches only exists in the
          # committed bytes.
          ./scripts/check-brand-licence-consistency.sh
          ./scripts/generate-assets.sh
          # Freshness. This is the only moment where the committed bytes still
          # exist, so it is the only place the repository can be proved current.
          # Everything after this point compares two generations to each other,
          # which two runs of one toolchain always pass.
          git diff --exit-code -- assets/brand apps/web/assets proofs/brand
          find assets/brand apps/web/assets proofs/brand -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > /tmp/assets-first.sha256
          ./scripts/generate-assets.sh
          find assets/brand apps/web/assets proofs/brand -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > /tmp/assets-second.sha256
          # Determinism, a distinct property: the generator must not depend on
          # the clock, on filesystem order, or on its own previous output.
          diff -u /tmp/assets-first.sha256 /tmp/assets-second.sha256
