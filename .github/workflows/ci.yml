name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # Pinned tool version, run through uv: the machine doctrine bans `pip
      # install` and manual virtualenvs. `charset-normalizer` gives the linter
      # the encoding detection it needs on non-UTF-8 inputs.
      - name: Lint per-path licence declarations
        run: uvx --from 'reuse[charset-normalizer]==6.2.0' reuse lint

  rust-contracts:
    name: Rust contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.85.1
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Audit Rust advisories, licenses and sources
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check
      - name: Verify renderer-independent contracts
        run: ./scripts/check-rust.sh

  dry-run-portability:
    name: Portable dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Reject contributor-specific paths and compile scripts
        run: python3 scripts/check-dry-run-portability.py
      - name: Parse workflow module
        run: node --check dry-run/scripts/workflow-dry-run.js
      - name: Reproduce M1 sensitivity evidence twice
        run: python3 scripts/verify-m1-sensitivity.py

  brand-assets:
    name: Deterministic brand assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install local rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends librsvg2-bin libxml2-utils imagemagick
      - name: DIAGNOSTIC record the rendering toolchain
        run: |
          set -euo pipefail
          echo "=== apt candidates ==="
          apt-cache policy librsvg2-bin libxml2-utils imagemagick
          echo "=== installed closure ==="
          dpkg-query -W -f='PKG ${binary:Package}=${Version}\n' \
            librsvg2-bin librsvg2-2 libxml2-utils libxml2 imagemagick \
            imagemagick-6.q16 libmagickcore-6.q16-7 libmagickwand-6.q16-7 \
            libpng16-16t64 libcairo2 libfreetype6 libfontconfig1 2>&1 || true
          echo "=== binaries ==="
          rsvg-convert --version
          convert --version | head -3
          echo "=== fontconfig families ==="
          fc-list : family | tr ',' '\n' | sort -u
      - name: DIAGNOSTIC compare the committed bytes to a regeneration
        run: |
          set -euo pipefail
          ./scripts/check-brand-licence-consistency.sh
          ./scripts/generate-assets.sh
          echo "=== git diff --stat ==="
          git --no-pager diff --stat -- assets/brand apps/web/assets proofs/brand || true
          echo "=== sha256 of the regenerated tree ==="
          find assets/brand apps/web/assets proofs/brand -type f -print0 \
            | sort -z | xargs -0 sha256sum
          echo "=== structural comparison ==="
          python3 .github/diagnose-asset-divergence.py
      - name: DIAGNOSTIC publish the regenerated assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regenerated-brand-assets
          path: |
            assets/brand
            apps/web/assets
            proofs/brand
          if-no-files-found: error
